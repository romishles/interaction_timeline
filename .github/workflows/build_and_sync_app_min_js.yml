name: Build and Sync App.min.js

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v6
        with:
          path: current-repo

      - name: Checkout source repo
        uses: actions/checkout@v6
        with:
          repository: Yuval-Roth/interactive_timeline
          token: ${{ secrets.PAT_TOKEN }}
          path: source-repo

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source-repo/web_app/package-lock.json

      - name: Install dependencies
        working-directory: source-repo/web_app
        run: npm ci

      - name: Build
        working-directory: source-repo/web_app
        run: npm run build

      - name: Copy and patch files
        run: |
          DIST="source-repo/web_app"
          DEST="current-repo"

          if [ ! -f "$DIST/dist/App.min.js" ]; then
            echo "ERROR: $DIST/dist/App.min.js not found."
            exit 1
          fi

          sed 's/\/assets/\.\/assets/g' "$DIST/dist/App.min.js" > "$DEST/src/App.min.js"
          cp "$DIST/src/content-panel/ContentPanel.css"     "$DEST/src/content-panel/ContentPanel.css"
          cp "$DIST/src/time-nav/TimeNav.css"               "$DEST/src/time-nav/TimeNav.css"
          cp "$DIST/src/App.css"                            "$DEST/src/App.css"
          cp "$DIST/src/Loader.js"                          "$DEST/src/Loader.js"
          cp "$DIST/src/Loader.css"                         "$DEST/src/Loader.css"

      - name: Commit and push
        working-directory: current-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            src/App.min.js \
            src/content-panel/ContentPanel.css \
            src/time-nav/TimeNav.css \
            src/App.css \
            src/Loader.js \
            src/Loader.css

          if git diff --cached --quiet; then
            echo "No changes detected — skipping commit."
          else
            git commit -m "chore: sync build output from source repo [skip ci]"
            git push
          fi
